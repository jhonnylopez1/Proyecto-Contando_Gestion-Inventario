<!--Seccion Hero-->
 <section class="hero align-items-stretch seccion_crear_articulo" style="display:block;">
  
    <div class="container ">
        <div class="row justify-content-center align-items-center">
          <div class="col-md-12 ">
            <h1>Ingresar Articulo</h1>
            <form id="articuloForm" class="card p-4 shadow bg_formulario">
              <div class="row">
              
                <div class="col-md-3 mb-3">
                  <label class="form-label">Nombre:</label>
                  <input class="form-control" type="text" name="nombre_articulo" required>
                </div>
      
                <div class="col-md-2 mb-3">
                  <label class="form-label">Precio:</label>
                  <input class="form-control" type="number" name="precio_articulo" required>
                </div>
      
                <div class="col-md-2 mb-3">
                  <label class="form-label">Marca:</label>
                  <input class="form-control" type="text" name="marca_articulo" required>
                </div>
      
                <div class="col-md-3 mb-3">
                  <label class="form-label">Descripción:</label>
                  <input class="form-control" type="text" name="descripcion_articulo" required>
                </div>

      
              </div>
              
              <button type="submit" class="btn boton_submit col-md-3 mx-auto">Guardar Articulo</button>
            </form>
            <p id="respuesta"></p>
          </div>
        </div>
      </div>
</section>

<div class="d-flex justify-content-center align-items-center gap-5">
  <button type="button" class="btn_articulos btn_todos_articulos btn btn-lg ">Todos</button>
  <button type="button" class="btn_articulos btn_articulos_activos btn btn-lg ">Articulos Activos</button>
  <button type="button" class="btn_articulos btn_articulos_inactivos btn btn-lg  ">Articulos Inactivos</button>
</div>



<section class="hero align-items-stretch ">
    <div class="container">
        <div id="tabla_Articulos" class="row justify-content-center" style="display:none;">
          <div class="col-md-12 ">
            <div class="table-responsive">
                <h1>Articulos</h1>
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered" id="tabla_articulo">
                            <thead>
                            <tr>
                                <th>Id</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Marca</th>
                                <th>Descripcion</th>
                                <th>Opciones</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                
            </div>
          </div>
        </div>
    </div>
</section>

<!-- Actualizar Articulo -->
<div class="modal fade" id="modalActualizar" tabindex="-1" aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content modal_personalizado">

      <div id="contenedorActualizar">

        <h1>Actualizar Articulo</h1>

        <form id="actualizarArticuloForm" class="card p-4 shadow bg_formulario">

          <div class="row">

            <div class="col-md-3 mb-3">
              <label class="form-label">Nombre:</label>
              <input class="form-control" type="text" id="actualizar_nombre">
            </div>

            <div class="col-md-2 mb-3">
              <label class="form-label">Precio:</label>
              <input class="form-control" type="number" id="actualizar_precio">
            </div>

            <div class="col-md-2 mb-3">
              <label class="form-label">Marca:</label>
              <input class="form-control" type="text" id="actualizar_marca">
            </div>

            <div class="col-md-3 mb-3">
              <label class="form-label">Descripción:</label>
              <input class="form-control" type="text" id="actualizar_descripcion">
            </div>

          </div>

          <button type="submit" class="btn boton_submit col-md-3 mx-auto">
            Actualizar Articulo
          </button>

        </form>

      </div>

    </div>

  </div>

</div>
